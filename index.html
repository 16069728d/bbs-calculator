<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berg Balance Scale (BBS) Calculator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f4f7f6;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .calculator-container {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .item {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        .item label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #2c3e50;
        }
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        button {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        #result-container {
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            display: none;
        }
        .score {
            font-size: 32px;
            font-weight: bold;
            color: #2c3e50;
        }
        .interpretation {
            font-size: 20px;
            margin-top: 10px;
            font-weight: bold;
            color: #e67e22;
        }
    </style>
</head>
<body>

    <h1>Berg Balance Scale Calculator</h1>
    
    <div class="calculator-container">
        <form id="bbs-form">
            </form>

        <button type="button" onclick="calculateScore()">Calculate Score</button>

        <div id="result-container">
            <div class="score" id="score-display"></div>
            <div class="interpretation" id="interpretation-display"></div>
        </div>
    </div>

    <script>
        // The 14 items of the Berg Balance Scale
        const bbsItems = [
            "1. Sitting to standing",
            "2. Standing unsupported",
            "3. Sitting with back unsupported but feet supported on floor or on a stool",
            "4. Standing to sitting",
            "5. Transfers",
            "6. Standing unsupported with eyes closed",
            "7. Standing unsupported with feet together",
            "8. Reaching forward with outstretched arm while standing",
            "9. Pick up object from the floor from a standing position",
            "10. Turning to look behind over left and right shoulders while standing",
            "11. Turn 360 degrees",
            "12. Place alternate foot on step or stool while standing unsupported",
            "13. Standing unsupported one foot in front",
            "14. Standing on one foot"
        ];

        // Options for each item (0-4)
        const scoreOptions = [
            { value: 0, text: "0 - Lowest level of function" },
            { value: 1, text: "1 - Low level of function" },
            { value: 2, text: "2 - Moderate level of function" },
            { value: 3, text: "3 - High level of function" },
            { value: 4, text: "4 - Highest level of function (Independent)" }
        ];

        // Generate the form dynamically
        const form = document.getElementById('bbs-form');
        
        bbsItems.forEach((item, index) => {
            const itemDiv = document.createElement('div');
            itemDiv.className = 'item';
            
            const label = document.createElement('label');
            label.textContent = item;
            
            const select = document.createElement('select');
            select.id = `item-${index + 1}`;
            
            // Default "Select a score" option
            const defaultOption = document.createElement('option');
            defaultOption.value = "";
            defaultOption.textContent = "-- Select Score --";
            defaultOption.disabled = true;
            defaultOption.selected = true;
            select.appendChild(defaultOption);

            scoreOptions.forEach(opt => {
                const option = document.createElement('option');
                option.value = opt.value;
                option.textContent = opt.text;
                select.appendChild(option);
            });

            itemDiv.appendChild(label);
            itemDiv.appendChild(select);
            form.appendChild(itemDiv);
        });

        // Calculation and Interpretation Logic
        function calculateScore() {
            let totalScore = 0;
            let allAnswered = true;

            // Loop through all 14 selects to get values
            for (let i = 1; i <= 14; i++) {
                const select = document.getElementById(`item-${i}`);
                const value = parseInt(select.value);
                
                if (isNaN(value)) {
                    allAnswered = false;
                    break;
                }
                totalScore += value;
            }

            if (!allAnswered) {
                alert("Please answer all 14 items before calculating.");
                return;
            }

            // Determine interpretation based on your provided criteria
            let interpretationText = "";
            let bgColor = "";

            if (totalScore >= 0 && totalScore <= 20) {
                interpretationText = "Interpretation: Mobility by wheelchair";
                bgColor = "#ffdddd"; // Light red alert
            } else if (totalScore >= 21 && totalScore <= 40) {
                interpretationText = "Interpretation: Walking with assistance";
                bgColor = "#fff5cc"; // Light yellow alert
            } else if (totalScore >= 41 && totalScore <= 56) {
                interpretationText = "Interpretation: Walking independently";
                bgColor = "#d4edda"; // Light green alert
            }

            // Display results
            const resultContainer = document.getElementById('result-container');
            const scoreDisplay = document.getElementById('score-display');
            const interpretationDisplay = document.getElementById('interpretation-display');

            scoreDisplay.textContent = `Total Score: ${totalScore} / 56`;
            interpretationDisplay.textContent = interpretationText;
            
            resultContainer.style.display = "block";
            resultContainer.style.backgroundColor = bgColor;
        }
    </script>
</body>
</html>
